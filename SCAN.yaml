attack_technique: SCAN
display_name: Localhost Network Scanning and Discovery
atomic_tests:

# -------------------------------------------------
# T1016 – System Network Configuration Discovery
# -------------------------------------------------
- name: Local Network Configuration Discovery
  auto_generated_guid: 11111111-1111-1111-1111-111111111101
  description: >
    Enumerates local network interfaces, IP configuration,
    routing table and interface state on the local host.
  supported_platforms:
    - windows
  executor:
    name: command_prompt
    command: |
      ipconfig /all
      route print
      netsh interface show interface

      # Atomic mapping
      Invoke-AtomicTest T1016 -TestNumbers 1


# -------------------------------------------------
# T1018 – Host Discovery
# -------------------------------------------------
- name: Localhost Host Discovery
  auto_generated_guid: 11111111-1111-1111-1111-111111111102
  description: >
    Performs host discovery against localhost using ICMP
    echo requests and NetBIOS queries.
  supported_platforms:
    - windows
  executor:
    name: command_prompt
    command: |
      ping -n 3 127.0.0.1
      nbtstat -A 127.0.0.1

      # Atomic mapping
      Invoke-AtomicTest T1018 -TestNumbers 1

# -------------------------------------------------
# T1046 – Network Service Discovery
# -------------------------------------------------
- name: Localhost Network Service Discovery
  auto_generated_guid: 11111111-1111-1111-1111-111111111103
  description: >
    Probes common service ports on localhost to identify
    accessible network services.
  supported_platforms:
    - windows
  executor:
    name: powershell
    command: |
      $ports = 80,135,139,445,3389,5985,8080
      foreach ($p in $ports) {
        Test-NetConnection 127.0.0.1 -Port $p
      }

      # Atomic mapping
      Invoke-AtomicTest T1046 -TestNumbers 1
