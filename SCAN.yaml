# -------------------------------------------------
# T1071.001 – Application Layer Protocol
# -------------------------------------------------
- name: Localhost HTTP Beaconing
  auto_generated_guid: 11111111-1111-1111-1111-111111111110
  description: >
    Generates repeated HTTP requests to localhost to simulate
    command-and-control beaconing.
  supported_platforms:
    - windows
  executor:
    name: command_prompt
    command: |
      for /L %i in (1,1,10) do curl http://127.0.0.1:8080/beacon

      # Atomic mapping
      Invoke-AtomicTest T1071.001 -TestNumbers 1
