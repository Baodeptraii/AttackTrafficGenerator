# -------------------------------------------------
# T1040 – Network Sniffing
# -------------------------------------------------
- name: Localhost Network Sniffing via pktmon
  auto_generated_guid: 11111111-1111-1111-1111-111111111106
  description: >
    Captures network traffic locally to observe scanning
    and service discovery activity.
  supported_platforms:
    - windows
  executor:
    name: powershell
    command: |
      pktmon start
      Start-Sleep -Seconds 10
      pktmon stop

      # Atomic mapping
      Invoke-AtomicTest T1040 -TestNumbers 1

